<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotAnAI Member Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #040510;
        --deep: #07091b;
        --mint: #67f7c4;
        --iris: #7f74ff;
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(237, 243, 255, 0.96);
        --muted: rgba(191, 203, 235, 0.7);
        --panel: rgba(7, 9, 27, 0.82);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 12% -15%, rgba(127, 116, 255, 0.22), transparent 55%),
          linear-gradient(160deg, #040510, #07091b);
        color: var(--text);
        min-height: 100vh;
      }

      header {
        padding: 2.5rem 0 1.2rem;
      }

      .container {
        width: min(1100px, 92vw);
        margin: 0 auto 4rem;
      }

      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        text-decoration: none;
        color: inherit;
      }

      .brand-logo {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        padding: 0.45rem;
        background: linear-gradient(135deg, rgba(127, 116, 255, 0.9), rgba(103, 247, 196, 0.9));
        display: grid;
        place-items: center;
        box-shadow: 0 12px 30px rgba(103, 247, 196, 0.22);
      }

      .brand-logo svg {
        width: 100%;
        height: 100%;
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .brand-name {
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .brand-tagline {
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .header-links {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .header-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: clamp(1.8rem, 5vw, 2.4rem);
        box-shadow: 0 18px 40px rgba(8, 10, 24, 0.35);
      }

      form {
        display: grid;
        gap: 1.2rem;
      }

      label {
        display: grid;
        gap: 0.5rem;
        font-size: 0.95rem;
        color: var(--muted);
      }

      input {
        font: inherit;
        padding: 0.75rem 0.85rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(12, 14, 32, 0.8);
        color: var(--text);
      }

      input:focus-visible {
        outline: none;
        border-color: rgba(127, 116, 255, 0.6);
        box-shadow: 0 0 0 4px rgba(127, 116, 255, 0.25);
      }

      button,
      .link-button {
        font: inherit;
        border-radius: 12px;
        border: 0;
        padding: 0.75rem 1.4rem;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-decoration: none;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 0.35rem;
      }

      .btn-primary {
        background: linear-gradient(120deg, rgba(103, 247, 196, 0.94), rgba(127, 116, 255, 0.94));
        color: #040510;
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: var(--text);
      }

      .hidden {
        display: none !important;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      th,
      td {
        padding: 0.9rem 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        vertical-align: top;
        text-align: left;
      }

      th {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.75rem;
      }

      tbody tr:hover {
        background: rgba(10, 12, 30, 0.6);
      }

      .status-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        border-radius: 999px;
        padding: 0.3rem 0.75rem;
        background: rgba(103, 247, 196, 0.18);
        color: var(--mint);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.7rem;
      }

      .orders-empty {
        text-align: center;
        padding: 2rem 0;
        color: var(--muted);
      }

      .alert {
        margin-top: 1.2rem;
        padding: 0.9rem 1.1rem;
        border-radius: 14px;
        border: 1px solid rgba(103, 247, 196, 0.25);
        background: rgba(103, 247, 196, 0.12);
        color: var(--mint);
      }

      .alert.error {
        border-color: rgba(255, 127, 158, 0.45);
        background: rgba(255, 127, 158, 0.15);
        color: #ffb3c7;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      .summary {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      .summary-details {
        display: grid;
        gap: 0.4rem;
      }

      .summary-details span {
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      @media (max-width: 720px) {
        th,
        td {
          padding: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header-bar">
        <a class="brand" href="index.html">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 120 120" role="img" aria-labelledby="memberLogoTitle memberLogoDesc">
              <title id="memberLogoTitle">NotAnAI Logo</title>
              <desc id="memberLogoDesc">Notebook mascot with a friendly expression</desc>
              <rect x="18" y="18" width="84" height="84" rx="22" fill="#ffe8c6" />
              <path d="M34 48h52" stroke="#080a1d" stroke-width="6" stroke-linecap="round" />
              <path d="M42 64c4 6 8 10 18 10s14-4 18-10" stroke="#080a1d" stroke-width="6" stroke-linecap="round" fill="none" />
              <circle cx="48" cy="58" r="6" fill="#080a1d" />
              <circle cx="72" cy="58" r="6" fill="#080a1d" />
              <circle cx="60" cy="80" r="6" fill="#7f74ff" />
            </svg>
          </span>
          <span class="brand-copy">
            <span class="brand-name">NotAnAI</span>
            <span class="brand-tagline">Member portal</span>
          </span>
        </a>
        <nav class="header-links" aria-label="Secondary navigation">
          <a href="index.html">Back to site</a>
          <a href="mailto:sale@notanai.ca">Contact support</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section id="member-login" class="panel">
        <h1 style="margin-top: 0;">Access your account</h1>
        <p class="orders-empty">Use the email and password from onboarding to review your project status and payments.</p>
        <form id="member-login-form" novalidate>
          <label>
            Email address
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn-primary" type="submit">Sign in</button>
        </form>
        <div class="alert error hidden" id="member-login-error" role="alert"></div>
      </section>

      <section id="member-dashboard" class="panel hidden">
        <div class="summary">
          <div class="summary-details">
            <h2 id="member-greeting" style="margin: 0;">Welcome back</h2>
            <span id="member-contact"></span>
          </div>
          <div class="actions">
            <button class="btn-ghost" type="button" id="refresh-orders">Refresh orders</button>
            <button class="btn-ghost" type="button" id="member-logout">Sign out</button>
          </div>
        </div>
        <div class="alert hidden" id="member-alert" role="status"></div>
        <div class="table-wrapper">
          <table aria-describedby="member-orders-caption">
            <caption id="member-orders-caption" class="hidden">List of NotAnAI member orders</caption>
            <thead>
              <tr>
                <th scope="col">Order</th>
                <th scope="col">Project summary</th>
                <th scope="col">Payment &amp; documents</th>
              </tr>
            </thead>
            <tbody id="member-orders-body">
              <tr>
                <td colspan="3" class="orders-empty">Loading your membership details...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const MEMBER_TOKEN_KEY = "notanaiMemberToken";
      const MEMBER_PROFILE_KEY = "notanaiMemberProfile";

      const loginForm = document.getElementById("member-login-form");
      const loginPanel = document.getElementById("member-login");
      const loginError = document.getElementById("member-login-error");
      const dashboard = document.getElementById("member-dashboard");
      const ordersBody = document.getElementById("member-orders-body");
      const alertBox = document.getElementById("member-alert");
      const logoutButton = document.getElementById("member-logout");
      const refreshButton = document.getElementById("refresh-orders");
      const greeting = document.getElementById("member-greeting");
      const contactLine = document.getElementById("member-contact");

      function storeToken(token) {
        localStorage.setItem(MEMBER_TOKEN_KEY, token);
      }

      function getToken() {
        return localStorage.getItem(MEMBER_TOKEN_KEY);
      }

      function clearToken() {
        localStorage.removeItem(MEMBER_TOKEN_KEY);
      }

      function storeProfile(profile) {
        localStorage.setItem(MEMBER_PROFILE_KEY, JSON.stringify(profile));
      }

      function getProfile() {
        const raw = localStorage.getItem(MEMBER_PROFILE_KEY);
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch (error) {
          return null;
        }
      }

      function clearProfile() {
        localStorage.removeItem(MEMBER_PROFILE_KEY);
      }

      function showLogin(message) {
        dashboard.classList.add("hidden");
        loginPanel.classList.remove("hidden");
        if (message) {
          loginError.textContent = message;
          loginError.classList.remove("hidden");
        } else {
          loginError.classList.add("hidden");
        }
      }

      function showDashboard() {
        loginPanel.classList.add("hidden");
        dashboard.classList.remove("hidden");
      }

      function setSummary(profile) {
        if (!profile) {
          greeting.textContent = "Welcome back";
          contactLine.textContent = "";
          return;
        }
        greeting.textContent = `Welcome back, ${profile.fullName}`;
        contactLine.textContent = `${profile.email} • ${profile.phone || "No phone on file"}`;
      }

      function statusTag(status) {
        return `<span class="status-tag">${status.replace(/_/g, " ")}</span>`;
      }

      function paymentSummary(transaction) {
        if (!transaction) {
          return "Pending payment setup.";
        }
        const amount = (transaction.amount_cents / 100).toFixed(2);
        return `${transaction.status.toUpperCase()} • $${amount}`;
      }

      function renderOrders(orders, token) {
        if (!orders.length) {
          ordersBody.innerHTML = `<tr><td colspan="3" class="orders-empty">No active orders. Start a new project from the <a href="index.html#join">NotAnAI onboarding form</a>.</td></tr>`;
          return;
        }

        ordersBody.innerHTML = "";
        orders.forEach((order) => {
          const row = document.createElement("tr");
          const created = new Date(order.created_at).toLocaleString(undefined, {
            dateStyle: "medium",
            timeStyle: "short",
          });
          const resumeLink = order.resume
            ? `/api/members/orders/${order.id}/resume?token=${encodeURIComponent(token)}`
            : null;
          const paymentPaid = order.transaction?.status === "paid";
          const amount = order.transaction ? (order.transaction.amount_cents / 100).toFixed(2) : null;
          row.innerHTML = `
            <td>
              <strong>#${order.id}</strong><br />
              ${statusTag(order.status)}<br />
              <small>Created ${created}</small><br />
              <small>${order.membership_plan.replace(/_/g, " ")}</small>
            </td>
            <td>
              <div><strong>Desired role:</strong> ${order.desired_role || "—"}</div>
              <div><strong>Key attributes:</strong> ${order.job_attributes || "—"}</div>
              <div><strong>Project notes:</strong> ${order.project_notes || "—"}</div>
            </td>
            <td>
              <div>${paymentSummary(order.transaction)}</div>
              ${
                paymentPaid
                  ? ""
                  : `<button class="btn-primary" type="button" data-pay="${order.id}" data-amount="${amount || ""}">Complete payment</button>`
              }
              <div style="margin-top: 0.75rem;">
                ${
                  resumeLink
                    ? `<a class="link-button btn-ghost" href="${resumeLink}" target="_blank" rel="noopener">Download uploaded resume</a>`
                    : "Resume upload pending"
                }
              </div>
            </td>
          `;
          ordersBody.appendChild(row);
        });
      }

      async function fetchOrders(showMessage = true) {
        const token = getToken();
        if (!token) {
          showLogin();
          return;
        }

        ordersBody.innerHTML = `<tr><td colspan="3" class="orders-empty">Loading your membership details...</td></tr>`;

        try {
          const response = await fetch("/api/members/orders", {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (response.status === 401 || response.status === 403) {
            throw new Error("Your session expired. Please sign in again.");
          }

          if (!response.ok) {
            throw new Error("Unable to load orders at this time.");
          }

          const data = await response.json();
          renderOrders(data.orders || [], token);
          if (showMessage) {
            showAlert("Latest order information loaded.");
          } else {
            hideAlert();
          }
        } catch (error) {
          hideAlert();
          clearToken();
          clearProfile();
          showLogin(error.message);
        }
      }

      function showAlert(message, isError = false) {
        alertBox.textContent = message;
        alertBox.classList.remove("hidden", "error");
        if (isError) {
          alertBox.classList.add("error");
        }
      }

      function hideAlert() {
        alertBox.classList.add("hidden");
        alertBox.classList.remove("error");
      }

      async function handleLogin(event) {
        event.preventDefault();
        loginError.classList.add("hidden");

        const formData = new FormData(loginForm);
        const payload = {
          email: formData.get("email"),
          password: formData.get("password"),
        };

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({ message: "Invalid credentials." }));
            throw new Error(error.message || "Invalid credentials.");
          }

          const data = await response.json();
          storeToken(data.token);
          if (data.user) {
            storeProfile(data.user);
            setSummary(data.user);
          } else {
            setSummary(getProfile());
          }
          showDashboard();
          renderOrders(data.orders || [], data.token);
          showAlert("Signed in successfully. Order data is current.");
        } catch (error) {
          loginError.textContent = error.message || "Unable to sign in.";
          loginError.classList.remove("hidden");
        }
      }

      async function completePayment(orderId, amount) {
        try {
          const response = await fetch(`/api/orders/${orderId}/pay`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              reference: `MEM-${orderId}-${Date.now()}`,
              method: "card",
            }),
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({ message: "Payment failed." }));
            throw new Error(error.message || "Payment failed.");
          }

          await fetchOrders(false);
          const amountLabel = amount ? `$${amount}` : "membership";
          showAlert(`Payment confirmed for ${amountLabel}. Your specialists have been notified.`);
        } catch (error) {
          showAlert(error.message || "Unable to complete payment.", true);
        }
      }

      loginForm.addEventListener("submit", handleLogin);

      logoutButton.addEventListener("click", () => {
        clearToken();
        clearProfile();
        showLogin();
      });

      refreshButton.addEventListener("click", () => {
        fetchOrders();
      });

      ordersBody.addEventListener("click", (event) => {
        const payButton = event.target.closest("[data-pay]");
        if (!payButton) return;
        const orderId = payButton.dataset.pay;
        const amount = payButton.dataset.amount;
        const originalText = payButton.textContent;
        payButton.disabled = true;
        payButton.textContent = "Processing...";
        completePayment(orderId, amount).finally(() => {
          payButton.disabled = false;
          payButton.textContent = originalText;
        });
      });

      document.addEventListener("DOMContentLoaded", () => {
        const profile = getProfile();
        if (profile) {
          setSummary(profile);
        }
        const token = getToken();
        if (token) {
          showDashboard();
          fetchOrders(false);
        }
      });
    </script>
  </body>
</html>
